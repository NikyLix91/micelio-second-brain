# Contributor License Agreement: a ogni pull request controlla che l'autore abbia accettato CLA.md
# (con un commento sulla PR). Le firme si salvano in signatures/cla.json sul branch `cla-signatures`,
# così restano nella repository senza servizi esterni.
# EN: Contributor License Agreement: on every pull request checks that the author accepted CLA.md
#     (with a comment on the PR). Signatures are stored in signatures/cla.json on the `cla-signatures`
#     branch, so they stay in the repository with no external service.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # Il maintainer non firma il proprio CLA; i bot nemmeno
          # EN: The maintainer doesn't sign their own CLA; neither do bots
          allowlist: salvatorestracquadanio86,dependabot[bot],github-actions[bot]
