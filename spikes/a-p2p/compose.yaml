# 3 nodi Micelio su una sola immagine. Limiti di memoria bassi per non pesare sulla macchina.
# Rete: DHT pubblica di Hyperswarm (come nello scenario reale su internet).
x-node: &node
  image: micelio-spike-a
  build: .
  mem_limit: 256m
  restart: "no"
  stop_grace_period: 5s

services:
  node1:
    <<: *node
    environment: { NAME: node1, ROLE: founder, INVITE: "node2,node3" }
    ports: ["7301:7300"]
    volumes: [shared:/shared]
  node2:
    <<: *node
    environment: { NAME: node2, ROLE: joiner }
    ports: ["7302:7300"]
    volumes: [shared:/shared]
  node3:
    <<: *node
    environment: { NAME: node3, ROLE: joiner }
    ports: ["7303:7300"]
    volumes: [shared:/shared]

  # Ingresso tardivo: avviato a mano dallo scenario 6
  node4:
    <<: *node
    profiles: [late]
    environment: { NAME: node4, ROLE: joiner }
    ports: ["7304:7300"]
    volumes: [shared:/shared]

volumes:
  shared:
